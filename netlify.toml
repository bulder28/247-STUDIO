[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Node 22: firebase-admin 14 usa dependencias solo-ESM (jose 6) que fallan con ERR_REQUIRE_ESM en Node < 22.12
[build.environment]
  NODE_VERSION = "22"

[functions]
  included_files = ["studio-ff8d1-*.json", "netlify/functions/studio-ff8d1-*.json"]

# Proxy de autenticación Firebase en el mismo dominio (elimina problemas de cookies de terceros y Safari ITP)
[[redirects]]
  from = "/__/auth/*"
  to = "https://studio-ff8d1.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Redirección de llamadas API a Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirección SPA estándar para React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad HTTP y protección de datos para producción y dominio final .com
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://*.googleapis.com https://www.gstatic.com https://accounts.google.com https://*.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google.com https://www.gstatic.com https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://*.firebasestorage.app https://*.googleusercontent.com https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://fcmregistrations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://*.firebasestorage.app https://firebasestorage.googleapis.com https://*.firebaseapp.com https://studio-ff8d1.firebaseapp.com https://accounts.google.com https://*.google.com; frame-src 'self' https://studio-ff8d1.firebaseapp.com https://*.firebaseapp.com https://accounts.google.com https://*.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://studio-ff8d1.firebaseapp.com https://*.firebaseapp.com https://accounts.google.com https://*.google.com;"

# Cabeceras de Service Worker y Manifiesto PWA (Siempre frescas para actualización instantánea)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Caché inmutable a largo plazo para assets estáticos hasheados (CSS/JS/Fuentes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
