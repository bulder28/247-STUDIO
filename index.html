      /* Ocultar instantáneamente cualquier elemento inyectado por Netlify Deploy Previews */
      netlify-drawer,

      #netlify-drawer,
      .netlify-drawer,
      div[class*="netlify-drawer"],
      iframe[id*="netlify"],

    <script>
      (function () {
        var SELECTORS = 'netlify-drawer, [data-netlify-deploy-id], #netlify-drawer, .netlify-drawer, iframe[src*="netlify"]';
        var removeNetlifyElements = function () {
          var targets = document.querySelectorAll(SELECTORS);
          for (var i = 0; i < targets.length; i++) {
            try {
              targets[i].remove();
            } catch (e) {
              targets[i].style.display = 'none';
            }
          }
        };

        removeNetlifyElements();

        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              if (mutations[i].addedNodes.length > 0) {
                removeNetlifyElements();
                break;
              }
            }
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });

          // Desconectar observer tras 8s para no penalizar el rendimiento de React en runtime
          window.addEventListener('load', function () {
            removeNetlifyElements();
            setTimeout(function () {
              observer.disconnect();
            }, 8000);
          }, { once: true });
        }
      })();
